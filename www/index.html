<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CardSpoke — Local-first knowledge cards</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="app:version" content="0.21.1">
  <meta name="app:author" content="Jeffrey Guntly, JX Holdings, LLC">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Content Security Policy.
       'unsafe-eval' is required on this page only because the plugin
       runtime syntax-checks plugin js/teardownJs source at install time via
       `new AsyncFunction(...)` (_checkSyntax in www/src/core/plugin-api.js,
       also exposed as CardSpoke.PluginSandbox.createFunction). That check
       parses but never executes the code; plugin code only ever runs inside
       its dedicated module Worker (see docs/policies/SECURITY_AND_SAFETY.md).
       connect-src is limited to same-origin plus the curated plugin gallery. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    connect-src 'self' https://raw.githubusercontent.com;
    img-src 'self' data: blob:;
    frame-src 'none';
    worker-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header" data-plugin-anchor="header">
    <div class="header-inner" data-plugin-anchor="header-inner">
      <button class="brand" id="brandBtn" aria-label="Go to home" data-plugin-anchor="brand"><img src="CardSpoke.svg" alt="CardSpoke" class="brand-logo" /></button>
      <div class="spacer"></div>
      <span id="saveStatus" class="save-status" title="" data-plugin-anchor="save-status"></span>
      <button class="header-btn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo last action" data-plugin-anchor="btn-undo">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
      </button>
      <button class="header-btn" id="homeBtn" title="Home" aria-label="Go to home" data-plugin-anchor="btn-home">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </button>
      <button class="header-btn" id="themeToggle" title="Switch to dark mode (Alt+T)" aria-label="Switch to dark mode" data-plugin-anchor="btn-theme-toggle">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
      <button class="header-btn" id="menuBtn" title="Open menu" aria-label="Open menu" aria-haspopup="dialog" aria-expanded="false" aria-controls="menuOverlay" data-plugin-anchor="btn-menu">&#9776;</button>
    </div>
  </header>

  <div class="menu-overlay" id="menuOverlay" data-plugin-anchor="menu-overlay">
    <div class="menu-panel" role="dialog" aria-modal="true" aria-labelledby="menuTitle" data-plugin-anchor="menu-panel">
      <div class="menu-header">
        <div class="menu-title" id="menuTitle">Menu</div>
        <button class="menu-close" id="menuClose" aria-label="Close menu">&#10005;</button>
      </div>
      
      <div class="menu-section">
        <div class="menu-section-title">Actions</div>
        <button class="menu-item" id="menuNewCard" data-plugin-anchor="menu-new-card">
          New Card
        </button>
        <button class="menu-item" id="menuUpload">
          Upload
        </button>
        <button class="menu-item" id="menuPluginManager" data-plugin-anchor="menu-plugin-manager">
          Plugin Manager
        </button>
        <button class="menu-item" id="menuAppearance">
          Appearance
        </button>
      </div>
      
      <div class="menu-section">
        <div class="menu-section-title">Navigate</div>
        <button class="menu-item" id="menuBookmarks">
          Bookmarks
        </button>
        <button class="menu-item" id="menuRecentCards">
          Recent Cards
        </button>
        <button class="menu-item" id="menuAdvancedSearch">
          Advanced Search
        </button>
        <button class="menu-item" id="menuTagManager">
          Tag Manager
        </button>
        <button class="menu-item" id="menuTrashBin">
          Trash Bin
        </button>
      </div>
      
      <div class="menu-section">
        <div class="menu-section-title">Data</div>
        <button class="menu-item" id="menuDataHub">
          Data & Export
        </button>
        <button class="menu-item menu-item-danger" id="menuClearAll">
          Clear All Data
        </button>
      </div>

      <div class="menu-section">
        <div class="menu-section-title">Help</div>
        <button class="menu-item" id="menuGettingStarted">
          Getting Started
        </button>
        <button class="menu-item" id="menuHelp">
          Help & Documentation
        </button>
        <button class="menu-item" id="menuKeyboardShortcuts">
          Keyboard Shortcuts
        </button>
      </div>

      <div class="menu-section" id="menuDeveloperSection" style="display: none;">
        <div class="menu-section-title">Developer</div>
        <button class="menu-item" id="menuDeveloperConsole">
          Developer Console
        </button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="breadcrumbs" id="breadcrumbs" data-plugin-anchor="breadcrumbs"></div>
    
    <main id="main" data-plugin-anchor="main-content"></main>

    <footer class="app-footer" data-plugin-anchor="footer">
      <p>Created by <a href="https://github.com/jxburros" target="_blank" rel="noopener noreferrer"><span id="app-creator"></span></a> for <a href="https://jxholdings.com" target="_blank" rel="noopener noreferrer"><span id="app-updater"></span></a></p>
      <p>CardSpoke <span id="app-version"></span> (<span id="app-release-date"></span>) &middot; <a href="https://github.com/jxburros/CardSpoke" target="_blank" rel="noopener noreferrer">View the project on GitHub</a></p>
    </footer>
    
  </div>

  <div class="search-container" id="searchContainer" style="display: none;" data-plugin-anchor="search-container">
    <div class="search-input-wrapper">
      <button class="search-submit" id="searchSubmit" aria-label="Submit search" title="Search (or press Enter)">
        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
      <input type="search" class="search-input" id="searchInput" placeholder="Search cards… press Enter" aria-label="Search cards" data-plugin-anchor="search-input" />
      <select class="dataset-selector" id="datasetSelector" title="Select dataset(s) to search" aria-label="Select dataset to search">
        <option value="current">Current</option>
        <option value="all">All</option>
      </select>
      <button class="search-clear" id="searchClear" aria-label="Clear search">&#10005;</button>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" data-plugin-anchor="toast-container"></div>

  <div class="modal-overlay" id="uploadModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="uploadModalTitle">
      <div class="modal-header">
        <div class="modal-title" id="uploadModalTitle">Upload Content</div>
        <button class="modal-close" id="closeUploadModal" aria-label="Close upload modal">&#10005;</button>
      </div>
      
      <div class="modal-tabs" role="tablist" aria-label="Upload format">
        <button class="modal-tab active" id="tab-btn-json" data-tab="json" role="tab" aria-selected="true" aria-controls="tab-json" tabindex="0">JSON</button>
        <button class="modal-tab" id="tab-btn-txt" data-tab="txt" role="tab" aria-selected="false" aria-controls="tab-txt" tabindex="-1">TXT</button>
      </div>
      
      <div class="modal-body">
        <div class="tab-content active" id="tab-json" role="tabpanel" aria-labelledby="tab-btn-json">
          <div class="file-upload-area" id="fileUploadAreaJSON" role="button" tabindex="0" aria-describedby="uploadHintJSON">
            <div class="upload-text">Choose a JSON file, or drag &amp; drop it here</div>
            <div class="upload-hint" id="uploadHintJSON">Supports card, subtree, and instance exports</div>
          </div>
          <input type="file" id="fileInputJSON" accept=".json,application/json" tabindex="-1" aria-hidden="true" style="display: none;" />
          
          <div class="form-group">
            <label class="form-label" for="importLocationSelectJSON">Import Location</label>
            <select id="importLocationSelectJSON" class="form-select">
              <option value="root">Add as Root Cards</option>
            </select>
          </div>
        </div>
        
        <div class="tab-content" id="tab-txt" role="tabpanel" aria-labelledby="tab-btn-txt">
          <div class="file-upload-area" id="fileUploadAreaTXT" role="button" tabindex="0" aria-describedby="uploadHintTXT">
            <div class="upload-text">Choose a TXT file, or drag &amp; drop it here</div>
            <div class="upload-hint" id="uploadHintTXT">Plain text or hierarchical outline</div>
          </div>
          <input type="file" id="fileInputTXT" accept=".txt,text/plain" tabindex="-1" aria-hidden="true" style="display: none;" />
          
          <fieldset class="form-group form-fieldset">
            <legend class="form-label">Import Mode</legend>
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="txtImportMode" value="outline" checked />
                <div class="radio-label">
                  <div>Create Cards from Outline</div>
                  <div class="radio-description">Parse hierarchical structure into cards</div>
                </div>
              </label>
              <label class="radio-option">
                <input type="radio" name="txtImportMode" value="append" />
                <div class="radio-label">
                  <div>Append to Card Body</div>
                  <div class="radio-description">Add text to existing card details</div>
                </div>
              </label>
            </div>
          </fieldset>
          
          <div class="form-group">
            <label class="form-label" for="importLocationSelectTXT">Import Location</label>
            <select id="importLocationSelectTXT" class="form-select">
              <option value="root">Add as Root Cards (Outline Mode)</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Capacitor script - must be loaded before app scripts -->
  <script src="capacitor.js"></script>

  <!-- Offline status and PWA registration. Keeps local save state separate from remote sync state. -->
  <script src="offline-status.js"></script>

  <!-- Application entry point loader: prefers stable bundled app.js, falls back to ESM entry -->
  <script src="app-loader.js"></script>
</body>
</html>
