<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Dev-only harness (not deployed). Same policy as index.html; the
       inline harness script is allowed by hash only (tests/dev-pages-csp.test.js
       keeps the hash in sync). 'unsafe-eval' is needed because this page
       evals the bundle. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-eval' 'sha256-oc6r9zFc7K3m+l48cQJfdWENQ+I1rzvqI5jYMYIoMZc=';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    connect-src 'self' https://raw.githubusercontent.com;
    img-src 'self' data: blob:;
    frame-src 'none';
    worker-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">
  <title>CardSpoke Diagnostic</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    h1 { color: #333; }
    .test { padding: 10px; margin: 10px 0; border-radius: 4px; }
    .pass { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
    .fail { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>CardSpoke Diagnostic Report</h1>
  <div id="results"></div>
  
  <script>
    const results = document.getElementById('results');
    
    // Everything here is written with textContent/DOM APIs, never innerHTML:
    // details include localStorage key names and error messages, which are
    // attacker-influenced (e.g. a key created by an imported dataset).
    function addResult(name, status, details = '') {
      const div = document.createElement('div');
      div.className = 'test ' + status;
      const label = document.createElement('strong');
      label.textContent = status.toUpperCase() + ':';
      div.appendChild(label);
      div.appendChild(document.createTextNode(' ' + name));
      if (details) {
        const pre = document.createElement('pre');
        pre.textContent = String(details);
        div.appendChild(pre);
      }
      results.appendChild(div);
    }

    function addConclusion(status, heading, text) {
      const div = document.createElement('div');
      div.className = 'test ' + status;
      const h2 = document.createElement('h2');
      h2.textContent = heading;
      const p = document.createElement('p');
      p.textContent = text;
      div.appendChild(h2);
      div.appendChild(p);
      results.appendChild(div);
    }
    
    // Test 1: Check if localStorage is available
    try {
      localStorage.setItem('test', 'value');
      localStorage.removeItem('test');
      addResult('LocalStorage API', 'pass');
    } catch (e) {
      addResult('LocalStorage API', 'fail', e.message);
    }
    
    // Test 2: Load and parse capacitor.js
    fetch('capacitor.js')
      .then(r => r.text())
      .then(code => {
        addResult('Load capacitor.js', 'pass', `Loaded ${code.length} bytes`);
        
        try {
          eval(code);
          addResult('Execute capacitor.js', 'pass');
          
          if (window.Capacitor) {
            addResult('Capacitor object created', 'pass', `Platform: ${window.Capacitor.getPlatform()}`);
          } else {
            addResult('Capacitor object created', 'fail', 'window.Capacitor is undefined');
          }
        } catch (e) {
          addResult('Execute capacitor.js', 'fail', e.message);
        }
        
        // Test 3: Load and parse app.js
        return fetch('app.js');
      })
      .then(r => r.text())
      .then(code => {
        addResult('Load app.js', 'pass', `Loaded ${code.length} bytes`);
        
        // Check for syntax errors
        try {
          new Function(code);
          addResult('Parse app.js syntax', 'pass', 'No syntax errors');
        } catch (e) {
          addResult('Parse app.js syntax', 'fail', e.message);
          throw e;
        }
        
        // Execute it
        try {
          eval(code);
          addResult('Execute app.js', 'pass');
          
          // Check if main element has content after a delay
          setTimeout(() => {
            const main = document.getElementById('main');
            if (main && main.innerHTML.length > 0) {
              addResult('App initialization', 'pass', `Main element has ${main.innerHTML.length} characters`);
            } else {
              addResult('App initialization', 'info', 'Main element is empty (this is normal - waiting for user interaction)');
            }
            
            // Check localStorage for app data
            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
              keys.push(localStorage.key(i));
            }
            if (keys.length > 0) {
              addResult('LocalStorage data', 'pass', `Found keys: ${keys.join(', ')}`);
            } else {
              addResult('LocalStorage data', 'info', 'No data yet (this is normal for first run)');
            }
            
            // Final verdict
            addConclusion('pass', '[OK] CONCLUSION: The HTML app is working correctly!',
              'All JavaScript files load and execute without errors. The app is ready to use.');
          }, 500);
          
        } catch (e) {
          addResult('Execute app.js', 'fail', e.message + '\n\nStack:\n' + e.stack);
          
          // Final verdict for failure
          addConclusion('fail', '[ERROR] CONCLUSION: The HTML app has errors!', 'See the error details above.');
        }
      })
      .catch(e => {
        addResult('Overall test', 'fail', e.message);
      });
  </script>
</body>
</html>
